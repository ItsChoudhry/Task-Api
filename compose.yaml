services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app/services/api
    environment:
      - API_KEY=DEV-KEY
      - PYTHONUNBUFFERED=1
      - INTERNAL_KEY=worker-key
    command: uv run uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./services/worker:/app/services/worker
    environment:
      - API_KEY=DEV-KEY
      - PYTHONUNBUFFERED=1
    command: uv run uvicorn services.worker.main:app --host 0.0.0.0 --port 9000 --reload

  db:
    image: postgres:16-alpine
    container_name: task_pipeline_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_pipeline
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
