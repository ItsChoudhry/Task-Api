services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./services/api:/app/services/api
    environment:
      - API_KEY=DEV-KEY
      - PYTHONUNBUFFERED=1
      - INTERNAL_KEY=worker-key
    command: uv run uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: task_pipeline_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_pipeline
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 8;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/tasks || true;
      mc anonymous set download local/tasks;
      exit 0;
      "

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: uv run rq worker tasks
    depends_on:
      - redis
      - api
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
